name: test

# D-09: cross-platform CI wired now (Phase 22), running on the private repo.
# Rack-free — the test target links no libRack, fetches no Rack SDK, and needs no
# display server. The DSP core under src/dsp/*.hpp is plain C++17, so `make test`
# (and the Windows g++ fallback) build and run with only a compiler present.
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # ubuntu/macos ship GNU make + a C++17 compiler. No Rack toolchain needed.
      - name: make test (unix)
        if: runner.os != 'Windows'
        run: make test

      # windows-latest has no preinstalled GNU make and defaults to MSVC; invoke
      # g++ directly with the SAME flags as the Makefile TEST_CXXFLAGS so the build
      # stays consistent (notably -ffp-contract=off, no -ffast-math). The binary
      # runs from the checkout root so the tests/golden/*.f32 relative paths resolve.
      # The drift-on golden uses an epsilon tolerance off the canonical (macOS) OS
      # (handled inside test_golden.cpp); the workflow just builds and runs.
      # -static* links the MinGW runtime (libstdc++/libgcc/libwinpthread) into
      # test.exe so it launches without those DLLs on PATH — a dynamically-linked
      # binary exits 127 under Git-bash when the loader can't find them. Same libm
      # and -ffp-contract=off, so golden determinism is unchanged.
      - name: make test (windows / direct g++)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          g++ -std=c++17 -O2 -g -Isrc -Itests -Wall -Wextra -ffp-contract=off -static -static-libgcc -static-libstdc++ tests/*.cpp -o test.exe
          ./test.exe

  # Post-v2.0.0-rejection gate (see .planning/RETROSPECTIVE.md). The VCV library
  # toolchain builds ALL platforms with -std=c++11 — GCC on win/linux — and the
  # win-x64 leg links plugin.dll against libRack with full symbol resolution.
  # Local mac clang at -O3 masks both failure classes (C++17-isms; ODR'd in-class
  # static constexpr with no out-of-line definition), and the test legs above
  # compile -std=c++17 without the Rack shell TU, so neither catches them.
  # Two stages:
  #   1. strict -pedantic-errors C++11 compile of the plugin sources (catches the
  #      compile-stage class; SDK headers are -isystem so only OUR code is gated)
  #   2. exact reproduction of the library's win-x64 leg — MinGW cross-compile +
  #      full link vs libRack (catches the link-stage ODR class)
  toolchain-gate:
    runs-on: ubuntu-latest
    env:
      RACK_SDK_VERSION: 2.6.6
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Rack SDKs (linux headers + windows link stub)
        run: |
          curl -sSfL -o /tmp/sdk-lin.zip "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-lin-x64.zip"
          curl -sSfL -o /tmp/sdk-win.zip "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-win-x64.zip"
          unzip -q /tmp/sdk-lin.zip -d /tmp/lin
          unzip -q /tmp/sdk-win.zip -d /tmp/win
          test -d /tmp/lin/Rack-SDK/include
          ls /tmp/win/Rack-SDK/libRack*

      - name: Strict C++11 pedantic gate (our code only)
        run: |
          g++ -std=c++11 -pedantic-errors -fsyntax-only -Wall -Wextra -Wno-unused-parameter \
            -Isrc -isystem /tmp/lin/Rack-SDK/include -isystem /tmp/lin/Rack-SDK/dep/include \
            src/*.cpp

      - name: Install MinGW cross-compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64

      - name: win-x64 leg reproduction (compile + full link vs libRack)
        run: |
          mkdir -p build-ci
          for f in src/*.cpp; do
            x86_64-w64-mingw32-g++ -std=c++11 -O3 -funsafe-math-optimizations -fno-omit-frame-pointer \
              -Wall -Wextra -Wno-unused-parameter -march=nehalem -D_USE_MATH_DEFINES -municode \
              -Isrc -I/tmp/win/Rack-SDK/include -I/tmp/win/Rack-SDK/dep/include \
              -c -o "build-ci/$(basename "$f").o" "$f"
          done
          x86_64-w64-mingw32-g++ -municode -o build-ci/plugin.dll build-ci/*.o \
            -shared -L/tmp/win/Rack-SDK -lRack -static-libstdc++
          echo "win-x64 link gate: PASS"

      # The two gates above only cover headers reached through a .cpp. Since
      # Phase 30 landed src/AnalogVCO.cpp, the Rack shell also pulls the VCO
      # headers into them — but it does NOT replace src/vco_compile_canary.cpp,
      # and the difference is measured rather than asserted (Phase-29 D-08 +
      # Phase-30 research Finding 7). The shell feeds runtime-derived values
      # into only THREE of the eight VcoInputs DSP fields (pitchCV, morph,
      # character); the canary feeds all EIGHT, which is what makes
      # check_canary.sh [2b/5] report eight fields staying runtime-live at -O3.
      # Swapping one for the other would silently reduce constant-fold coverage
      # in exactly the fields Phases 31, 33 and 34 are about to make
      # load-bearing, and would delete four guard sections whose bodies all
      # begin by requiring the canary file to be present.
      #
      # So this step guards the canary itself: that it still emits code (a
      # bare-#include TU emits nothing and would leave the link leg above with
      # nothing to resolve), that it is C++11-clean, that the C++17-ism gate
      # demonstrably rejects known-bad synthetic TUs, and that every
      # src/dsp/Vco*.hpp is still included by it (the D-08 growth rule).
      # Needs no Rack SDK.
      - name: VCO compile canary guard (D-07/D-08)
        run: bash tests/check_canary.sh

      # D-05 tripwire. src/dsp/FROZEN.sha256 pins the shipped LFO's eleven-header
      # include closure, its shell, the two self-witnessing test files and the
      # fixture provenance record. A frozen file may change ONLY via a deliberate
      # manifest bump in the same commit (which is exactly what Phase 34 does for
      # DriftEngine.hpp). Text digests are computed over CR-stripped bytes so the
      # gate is correct on a CRLF checkout too; this runner is LF, where the
      # normalized and raw digests are identical. Needs no Rack SDK.
      - name: Frozen-header hash guard (D-05)
        run: bash tests/check_frozen.sh

      # D-06 tripwire. Asserts the one-way dependency boundary: VCO code may use
      # frozen shared headers, but no LFO translation unit may include a VCO
      # file. Also carries the R-9 ODR guard (exactly one forge::Inputs) and the
      # rule that the tripwire hasher never enters src/. Needs no compiler and no
      # Rack SDK.
      - name: Include / dependency-direction audit (D-06)
        run: bash tests/check_includes.sh

      # P-5, one level up. The three steps above and the Makefile's GUARD_SCRIPTS
      # list were independent hardcoded lists of the same three scripts, and CI
      # invoked only the scripts — so `make guards`, the command the Makefile
      # banner advertises as "one local command for every standing guard this
      # milestone adds", had NO execution coverage at all. A guard added in a
      # later phase and wired into CI (satisfying check_includes.sh [7/7]) but
      # omitted from GUARD_SCRIPTS would leave the local command silently
      # incomplete, which is the exact P-5 failure mode one level up.
      #
      # This step gives the Makefile list execution coverage. [7/7] additionally
      # requires every guard script to BE in GUARD_SCRIPTS, so the two lists
      # cannot drift apart in either direction. Deliberately additive rather than
      # a replacement for the three steps above: keeping the direct invocations
      # means a failure still names which guard failed in the CI step list.
      #
      # Needs no Rack SDK — `guards` is in the Makefile's plugin.mk skip filter.
      - name: LFO non-regression guard suite via make (P-5)
        run: make guards
